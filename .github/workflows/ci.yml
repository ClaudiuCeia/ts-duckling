name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality checks
        run: bun run check

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate package
        run: bun run package:check

      - name: Pack package
        run: npm pack --silent

      - name: Smoke test packed package with Bun
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(realpath "$(find . -maxdepth 1 -name '*.tgz' -print -quit)")"
          smoke="$(mktemp -d)"
          cd "${smoke}"
          npm init -y >/dev/null
          npm install "${tarball}" >/dev/null
          bun --eval 'import { Duckling } from "@claudiu-ceia/ts-duckling"; if (Duckling().extract("a@b.com")[0]?.kind !== "email") process.exit(1)'

      - name: Upload packed package
        uses: actions/upload-artifact@v6
        with:
          name: npm-package
          path: claudiu-ceia-ts-duckling-*.tgz

  node-runtime:
    needs: package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 24]
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download packed package
        uses: actions/download-artifact@v7
        with:
          name: npm-package
          path: package

      - name: Smoke test packed package
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(realpath "$(find package -name '*.tgz' -print -quit)")"
          smoke="$(mktemp -d)"
          cd "${smoke}"
          npm init -y >/dev/null
          npm install "${tarball}" >/dev/null
          node --input-type=module --eval 'import { Duckling } from "@claudiu-ceia/ts-duckling"; if (Duckling().extract("a@b.com")[0]?.kind !== "email") process.exit(1)'

  jsr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify package versions match
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          deno_version="$(node -p "require('./deno.json').version")"
          test "${package_version}" = "${deno_version}"

      - name: Check Deno compatibility
        run: DENO_NO_PACKAGE_JSON=1 deno check --frozen-lockfile mod.ts

      - name: Validate JSR package
        run: DENO_NO_PACKAGE_JSON=1 deno publish --dry-run --frozen-lockfile

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        run: npm ci
        working-directory: docs

      - name: Build docs
        run: npm run build
        working-directory: docs

name: Publish npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release versions
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '${tag}' is not a stable semantic version."
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          deno_version="$(node -p "require('./deno.json').version")"
          if [[ "${package_version}" != "${deno_version}" ]]; then
            echo "package.json version '${package_version}' does not match deno.json version '${deno_version}'."
            exit 1
          fi
          if [[ "${tag}" != "v${package_version}" ]]; then
            echo "Tag '${tag}' does not match package version '${package_version}'."
            exit 1
          fi

      - name: Run Bun checks
        run: bun run check

      - name: Validate npm package
        run: bun run package:check

      - name: Smoke test packed package
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(realpath "$(npm pack --silent)")"
          smoke="$(mktemp -d)"
          cp scripts/package_smoke.mjs "${smoke}/"
          cd "${smoke}"
          npm init -y >/dev/null
          npm install "${tarball}" >/dev/null
          npm ls --all
          bun package_smoke.mjs
          node package_smoke.mjs

      - name: Publish to npm
        run: npm publish --access public

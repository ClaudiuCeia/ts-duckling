name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release versions
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '${tag}' is not a stable semantic version."
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          deno_version="$(node -p "require('./deno.json').version")"
          if [[ "${package_version}" != "${deno_version}" ]]; then
            echo "package.json version '${package_version}' does not match deno.json version '${deno_version}'."
            exit 1
          fi
          if [[ "${tag}" != "v${package_version}" ]]; then
            echo "Tag '${tag}' does not match package version '${package_version}'."
            exit 1
          fi

      - name: Run Bun checks
        run: bun run check

      - name: Validate npm package
        run: bun run package:check

      - name: Validate Deno and JSR package
        run: |
          DENO_NO_PACKAGE_JSON=1 deno check --frozen-lockfile mod.ts
          DENO_NO_PACKAGE_JSON=1 deno publish --dry-run --frozen-lockfile

      - name: Pack npm package
        run: npm pack --silent

      - name: Smoke test packed package with Bun and Node
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(realpath "$(find . -maxdepth 1 -name '*.tgz' -print -quit)")"
          smoke="$(mktemp -d)"
          cd "${smoke}"
          npm init -y >/dev/null
          npm install "${tarball}" >/dev/null
          bun --eval 'import { Duckling } from "@claudiu-ceia/ts-duckling"; if (Duckling().extract("a@b.com")[0]?.kind !== "email") process.exit(1)'
          node --input-type=module --eval 'import { Duckling } from "@claudiu-ceia/ts-duckling"; if (Duckling().extract("a@b.com")[0]?.kind !== "email") process.exit(1)'

  publish-jsr:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Publish to JSR
        run: DENO_NO_PACKAGE_JSON=1 deno publish --frozen-lockfile

  publish-npm:
    needs: publish-jsr
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish to npm
        run: npm publish --access public

  github-release:
    needs: [publish-jsr, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate changelog
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          prev_tag="$(git tag --list 'v*' --sort=-version:refname | grep -v "^${tag}$" | head -n 1 || true)"
          {
            echo "# ${tag}"
            echo
            if [[ -n "${prev_tag}" ]]; then
              echo "Changes since ${prev_tag}:"
              echo
              git log --no-merges --pretty=format:'- %s (%h)' "${prev_tag}..${tag}"
            else
              echo "Changes:"
              echo
              git log --no-merges --pretty=format:'- %s (%h)' "${tag}"
            fi
            echo
          } > RELEASE_NOTES.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
